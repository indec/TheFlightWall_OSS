[platformio]
; Only build the original ESP-WROOM-32 + Waveshare 2" target by default.
; Build the other board explicitly with: pio run -e esp32s3_154
default_envs = esp32dev

[common]
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.12.0
    bblanchon/ArduinoJson @ ^7.4.2

lib_ldf_mode = deep+

build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>

build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config
    ; Workaround: this arduino-esp32 3.x core's "Network" library (folder
    ; Network/, library.properties name=Networking) isn't reliably picked up
    ; by PlatformIO's LDF for every WiFi/*.cpp translation unit, causing
    ; "Network.h: No such file or directory". Force the include path directly.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

; =============================================================================
;  ESP-WROOM-32 dev board + Waveshare 2" ST7789V TFT (240x320)
; =============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200
lib_deps = ${common.lib_deps}
lib_ldf_mode = ${common.lib_ldf_mode}
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -D FLIGHTWALL_BOARD_WROOM32_WAVESHARE2=1

; =============================================================================
;  ESP32-S3 Super Mini + generic 1.54" ST7789 TFT (240x240)
;  Pins proven working on this exact board+panel in a separate project
;  (BambuHelper); see firmware/README.md for the wiring table.
; =============================================================================
[env:esp32s3_154]
platform = espressif32
board = lolin_s3_mini
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200
lib_deps = ${common.lib_deps}
lib_ldf_mode = ${common.lib_ldf_mode}
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -D FLIGHTWALL_BOARD_S3SUPERMINI_154=1
